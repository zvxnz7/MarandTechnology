name: Publish Node.js update

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-main-update
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Run 6 is a one-time bridge: v0.3.4 installations accept schema 1 only.
      # Keep it below v0.4.x so already-updated installations skip this package.
      RELEASE_VERSION: ${{ github.run_number == 6 && '0.3.5' || format('0.4.{0}', github.run_number) }}
      RELEASE_TAG: ${{ github.run_number == 6 && 'v0.3.5' || format('v0.4.{0}', github.run_number) }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path . -Filter *.ps1 -File -Recurse | Where-Object {
            $_.FullName -notmatch '[\\/](\.git|node_modules|release|\.release)[\\/]'
          }
          $utf8Strict = [System.Text.UTF8Encoding]::new($false, $true)
          foreach ($file in $scripts) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) {
              throw "PowerShell script must be UTF-8 with BOM for Windows PowerShell 5.1: $($file.FullName)"
            }
            try {
              $null = $utf8Strict.GetString($bytes, 3, $bytes.Length - 3)
            } catch {
              throw "PowerShell script is not valid UTF-8: $($file.FullName)"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $details = $parseErrors | ForEach-Object { "$($file.FullName):$($_.Extent.StartLineNumber): $($_.Message)" }
              throw ($details -join [Environment]::NewLine)
            }
          }
          Write-Host "Verified $($scripts.Count) PowerShell scripts: UTF-8 BOM and syntax are valid."
      - name: Verify JavaScript app and save flow
        run: node --test
      - name: Prepare release files
        env:
          MARAND_RELEASE_SCHEMA: ${{ github.run_number == 6 && '1' || '2' }}
        run: node tools/build-release.js "$RELEASE_VERSION" release
      - name: Create release archive
        run: |
          cd release
          zip -r ../marand-node-release.zip .
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" marand-node-release.zip --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Automatic update from main commit $GITHUB_SHA." --latest
          else
            gh release create "$RELEASE_TAG" marand-node-release.zip --title "$RELEASE_TAG" --notes "Automatic update from main commit $GITHUB_SHA." --latest --target "$GITHUB_SHA"
          fi
